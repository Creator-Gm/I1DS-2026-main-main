<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetShop Amigo Fiel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="img/logo-transparente.png" alt="Logo do PetShop amigo fiel" width="100">
    </div>
    <button id="menu-btn">☰</button>
    <nav id="menu">
      <a href="#home">Home</a>
      <a href="#servicos">serviços</a>
      <a href="#galeria">Galeria</a>
      <a href="#contato">Contador</a>
      <a href="#localizacao">localização</a>
    </nav>

  </header>


  <!-- HERO -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>Cuidado do seu melhor amigo</h1>
      <p>banho, tosa, veterinário e muito carinho.</p>
      <a href="#contato" class="btn">Agendar agora</a>
    </div>



  </section>

  <!-- SERVIÇOS -->
  <section id="servicos" class="container">
    <h2>Nossos Serviços</h2>
    <div class="cards">
      <div class="card">
        <img src="img/banho.png" alt="Serviço de banho" />
        <h3>banho</h3>
        <p>Banho completo e hidratação </p>
      </div>
      <div class="card">
        <img src="img/tosa.png" alt="Serviço de tosa" />
        <h3>tosa</h3>
        <p>Tosa profissional</p>
      </div>
      <div class="card">
        <img src="img/veterinario.png" alt="Serviço de veterinaria" />
        <h3>Veterinaria</h3>
        <p>Veterinaria completa </p>
      </div>
    </div>
  </section>
  <!-- GALERIA -->
  <section id="galeria" class="container"></section>

  <!-- CONTATO -->
  <section id="contato" class="container"></section>

  <!-- MAPA -->
  <section id="localizacao" class="container"></section>

  <!-- FOOTER -->
  <footer></footer>

  <script src="js/script.js"></script>
</body>

</html>
