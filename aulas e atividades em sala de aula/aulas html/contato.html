
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
</head>
<body>
    <h3>Formulário Básico</h3>
    <form method="get" action="contato.html">
        <label>Nome</label>
        <input type="text" name="nome" placeholder="Digite seu nome..."  />
        <input type="submit" value="Enviar" /> <!-- Botão de Envio -->
    </form>

    <hr />
    <h3>Formulário de Cadastro</h3>
    <form method="get" action="#">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nomeCompleto">Nome Completo</label>
            <input type="text" name="nomeCompleto" placeholder="Digite seu nome completo" />
            <br />

            <label for="email">E-mail</label>
            <input type="email" name="email" placeholder="Digite seu E-mail..." />
            <br />

            <label for="cpf">CPF</label>
            <input type="number" name="cpf" placeholder="Digite seu CPF..." />
            <br />

        </fieldset>
        
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="datanascimento">data de nascimento</label>
            <input type="date" name="datanascimento" />
            <br />

            <label for="datacadastro">data nascimento</label>
            <input type="datetime-local" name="datacadastro" />
            <br />

            <input type="checkbox" name="SESI" />
            <label for="SESI">SESI</label>
            <input type="checkbox" name="SENAI" />
            <label for="SENAI">SENAI</label>
            <input type="checkbox" name="NEMNHUMA" />
            <label for="NEMNHUMA">NEMNHUMA ESCOLA</label>
            <input type="checkbox" name="TODAS " />
            <label for="TODAS ">todas as anteriores</label>
            <br />
<input type="radio" name="sexo" />
            <label for="sexo">masculino</label>
            <label for="sexo">feminino</label>
            <label for="sexo">prefiro não dizer</label>
            <br />
            <label for="curso">escolha seu curso</label>
            <select>
            <option value="0">HTML</option>
            <option value="1">CSS</option>
            <option value="2">JavaScript</option>
            </select>
            <br />
            <label for="comentarios">comentarios</label>
            <textarea name="comentarios" placeholder="digite seu comentario...." rows="10" cols="100"></textarea>
        </fieldset>

        <button type="submit">Enviar Dados</button>
        <button type="reset">Limpar o Fomulário</button>
    </form>

</body>
</html>
