<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peça a Melhor Esfiha</title>
  <link rel="stylesheet" href="css/style2.css" />
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <h1>peça a melhor<br>esfiha</h1>
      </div>
      <div class="header-right">
        <button class="btn-voltar" id="btnVoltar" >Voltar</button>
        <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300&q=80" alt="Esfihas" />
      </div>
    </div>

    <div class="tabs">
      <button class="tab active">salgadas</button>
      <button class="tab">doces</button>
    </div>

    <p class="section-label">salgadas e sabores imperdiveis</p>

    <div class="salgadas-row">
      <div class="salgadas-label">salgadas e<br>sabores<br>imperdiveis</div>
      <div class="item-card"></div>
      <div class="item-card"></div>
      <div class="item-card"></div>
      <div class="item-card light"></div>
      <div class="item-card light"></div>
    </div>

    <p class="section-label">doces e sabores imperdiveis</p>

    <div class="doces-row">
      <div class="doce-card"></div>
      <div class="doce-card"></div>
      <div class="doce-card"></div>
      <div class="doce-card"></div>
      <div class="doce-card"></div>
    </div>

    <div class="combos-section">
      <div class="combos-title-wrap">
        <span class="combos-title">combos</span>
      </div>
      <div class="combos-grid">
        <div class="combo-card"></div>
        <div class="combo-card tall"></div>
        <div class="combo-card highlight"></div>
      </div>
    </div>
  </div>

  <script src="js/cardapio2.js"></script>
</body>
</html>
